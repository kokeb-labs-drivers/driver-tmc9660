<text x="48" y="331.4" font-size="17" font-weight="700" fill="#7A360E">HARDWARE-AGNOSTIC CORE</text>
<text x="48" y="354.6" font-size="16" fill="#7A360E">TMC9660, inc/tmc9660.hpp</text>
<rect x="405.4" y="258.4" width="49.1" height="24" rx="12" fill="#FFFFFF"/>
<text x="430" y="276.2" font-size="16" font-weight="500" text-anchor="middle" fill="#566070">calls</text>
<text x="56" y="853.6" font-size="20" font-weight="700" fill="#7A360E">Port contract</text>
<text x="56" y="884.2" font-size="17" fill="#2B3442">SpiInterface&lt;YourPort&gt; or UartInterface&lt;YourPort&gt;: checked at compile time, no virtual</text>
<text x="56" y="908.9" font-size="17" fill="#2B3442">calls</text>
<text x="56" y="1031.6" font-size="20" font-weight="700" fill="#0B5F59">Your port</text>
<text x="56" y="1060.8" font-size="16" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#2B3442">EnsureInitialized()  Transfer()  Exchange()</text>
<text x="56" y="1183.6" font-size="20" font-weight="700" fill="#334155">TMC9660</text>
<text x="56" y="1214.2" font-size="17" fill="#2B3442">the chip, on the SPI or UART bus</text>
<rect x="322.9" y="774.6" width="214.1" height="24" rx="12" fill="#FFFFFF"/>
<text x="430" y="792.4" font-size="16" font-weight="500" text-anchor="middle" fill="#566070">register reads and writes</text>
<rect x="329.6" y="952.6" width="200.8" height="24" rx="12" fill="#FFFFFF"/>
<text x="430" y="970.4" font-size="16" font-weight="500" text-anchor="middle" fill="#566070">forwards to your hooks</text>
<rect x="349.7" y="1104.6" width="160.6" height="24" rx="12" fill="#FFFFFF"/>
<text x="430" y="1122.4" font-size="16" font-weight="500" text-anchor="middle" fill="#566070">SPI or UART bytes</text>
<text x="886" y="337.4" font-size="20" font-weight="700" fill="#7A360E">Shared</text>
<text x="886" y="360.8" font-size="17" fill="#7A360E">The core and the contract are</text>
<text x="886" y="385.5" font-size="17" fill="#7A360E">the same code on every MCU</text>
<text x="886" y="410.1" font-size="17" fill="#7A360E">and on the host.</text>
<text x="886" y="1031.6" font-size="20" font-weight="700" fill="#0B5F59">Yours</text>
<text x="886" y="1055.1" font-size="17" fill="#0B5F59">One small class per MCU or</text>
<text x="886" y="1079.7" font-size="17" fill="#0B5F59">board.</text>
