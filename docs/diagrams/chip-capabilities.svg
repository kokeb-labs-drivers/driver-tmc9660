<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1138" viewBox="0 0 1200 1138" role="img" aria-labelledby="chip-capabilities-title chip-capabilities-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="chip-capabilities-title">What the TMC9660 does</title>
<desc id="chip-capabilities-desc">Capability map of the TMC9660: FOC and servo loops (supported): Runs field-oriented current control and the torque, velocity and position loops in hardware; Ramp generator and homing (supported): Plans eight-point acceleration ramps in real time and searches the reference switches for home; Position feedback (supported): Reads Hall sensors, ABN encoders or an SPI encoder for commutation and position; Smart gate driver (supported): Drives up to four NMOS half-bridges, 1 A source and 2 A sink; Current sensing and measurement (supported): Amplifies the bottom-shunt currents and measures the supply voltage and the temperatures; Protections (supported): Overcurrent, gate-short, undervoltage and thermal protection; the flags are read before every start; Bootloader and application modes (supported): Sets up pins, clock and LDOs at power-up, then starts parameter mode (TMCL) or register mode; Hibernation and wake-up (supported): Switches all but the always-on block off; the WAKE pin or a timer powers the chip up again; OTP configuration (not covered): Stores the boot configuration permanently; the driver loads it and never burns it.</desc>
