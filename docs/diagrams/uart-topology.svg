<svg xmlns="http://www.w3.org/2000/svg" width="640" height="829" viewBox="0 0 640 829" role="img" aria-labelledby="uart-topology-title uart-topology-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="uart-topology-title">TMC9660 nodes on RS-485</title>
<desc id="uart-topology-desc">Several TMC9660 on one RS-485 bus: the host and every chip share the DATA+ and DATA- pair through transceivers, and each chip answers only commands sent to its own odd module address.</desc>
<rect x="0.5" y="0.5" width="639" height="828" rx="16" fill="#FFFFFF" stroke="#E2E7EE"/>
<text x="32" y="44.4" font-size="13" font-weight="700" letter-spacing="1.2" fill="#7A360E">SEVERAL CHIPS</text>
<text x="32" y="76.2" font-size="24" font-weight="700" fill="#0E1726">TMC9660 nodes on RS-485</text>
<text x="32" y="102.7" font-size="15" fill="#566070">Sources: ds UART, p. 25; pm Table 61, Full list of global parameters in bank</text>
<text x="32" y="124.5" font-size="15" fill="#566070">0, p. 143; pm Communication Interfaces, UART Interface, Tables 1 and 2, p.</text>
<text x="32" y="146.2" font-size="15" fill="#566070">8.</text>
<rect x="32" y="162.2" width="576" height="1" fill="#E2E7EE"/>
<path d="M510.7 216.4 L510.7 594.4" fill="none" stroke="#2B3442" stroke-width="2.2"/>
<path d="M452.3 224.4 L510.7 224.4" fill="none" stroke="#2B3442" stroke-width="1.8"/>
<path d="M452.3 316.4 L510.7 316.4" fill="none" stroke="#2B3442" stroke-width="1.8"/>
<path d="M452.3 430.4 L510.7 430.4" fill="none" stroke="#2B3442" stroke-width="1.8"/>
<path d="M452.3 544.4 L510.7 544.4" fill="none" stroke="#2B3442" stroke-width="1.8" stroke-dasharray="5 4"/>
<path d="M575.6 216.4 L575.6 594.4" fill="none" stroke="#2B3442" stroke-width="2.2"/>
<path d="M452.3 234.4 L575.6 234.4" fill="none" stroke="#2B3442" stroke-width="1.8"/>
<path d="M452.3 326.4 L575.6 326.4" fill="none" stroke="#2B3442" stroke-width="1.8"/>
<path d="M452.3 440.4 L575.6 440.4" fill="none" stroke="#2B3442" stroke-width="1.8"/>
<path d="M452.3 554.4 L575.6 554.4" fill="none" stroke="#2B3442" stroke-width="1.8" stroke-dasharray="5 4"/>
<rect x="32" y="208.4" width="420.3" height="74" rx="10" fill="#EAF2FF" stroke="#2563EB" stroke-width="1.4"/>
<rect x="32" y="216.4" width="4" height="58" rx="2" fill="#2563EB"/>
<rect x="32" y="300.4" width="420.3" height="96" rx="10" fill="#E6F6F4" stroke="#0B7A72" stroke-width="1.4"/>
<rect x="32" y="308.4" width="4" height="80" rx="2" fill="#0B7A72"/>
<rect x="32" y="414.4" width="420.3" height="96" rx="10" fill="#E6F6F4" stroke="#0B7A72" stroke-width="1.4"/>
<rect x="32" y="422.4" width="4" height="80" rx="2" fill="#0B7A72"/>
<rect x="32" y="528.4" width="420.3" height="74" rx="10" fill="#FFFFFF" stroke="#738093" stroke-width="1" stroke-dasharray="6 4"/>
<rect x="32" y="624.4" width="576" height="173.8" rx="10" fill="#F1F4F8" stroke="#CBD5E1" stroke-width="1"/>
<text x="52" y="236.8" font-size="17" font-weight="700" fill="#1E429F">Host</text>
<text x="52" y="264.6" font-size="15" fill="#2B3442">UART and RS-485 transceiver</text>
<text x="52" y="328.8" font-size="17" font-weight="700" fill="#0B5F59">TMC9660</text>
<text x="52" y="356.6" font-size="15" fill="#2B3442">address 1</text>
<text x="52" y="378.3" font-size="15" fill="#2B3442">UART_TXEN to the transceiver</text>
<text x="52" y="442.8" font-size="17" font-weight="700" fill="#0B5F59">TMC9660</text>
<text x="52" y="470.6" font-size="15" fill="#2B3442">address 3</text>
<text x="52" y="492.3" font-size="15" fill="#2B3442">UART_TXEN to the transceiver</text>
<text x="52" y="556.8" font-size="17" font-weight="700" fill="#0E1726">…</text>
<text x="52" y="584.6" font-size="15" fill="#2B3442">up to address 255</text>
<text x="510.7" y="208.4" font-size="14" font-weight="700" text-anchor="middle" fill="#0E1726">DATA+</text>
<circle cx="510.7" cy="224.4" r="3.6" fill="#2B3442"/>
<circle cx="510.7" cy="316.4" r="3.6" fill="#2B3442"/>
<circle cx="510.7" cy="430.4" r="3.6" fill="#2B3442"/>
<circle cx="510.7" cy="544.4" r="3.6" fill="#2B3442"/>
<text x="575.6" y="208.4" font-size="14" font-weight="700" text-anchor="middle" fill="#0E1726">DATA-</text>
<circle cx="575.6" cy="234.4" r="3.6" fill="#2B3442"/>
<circle cx="575.6" cy="326.4" r="3.6" fill="#2B3442"/>
<circle cx="575.6" cy="440.4" r="3.6" fill="#2B3442"/>
<circle cx="575.6" cy="554.4" r="3.6" fill="#2B3442"/>
<text x="46" y="652.8" font-size="17" font-weight="700" fill="#334155">Limits</text>
<text x="46" y="673.2" font-size="15" fill="#334155">SERIAL_ADDRESS: odd values 1 to 255; the default is 1 (Table 61, Full list</text>
<text x="46" y="695" font-size="15" fill="#334155">of global parameters in bank 0, p. 143). The module address is the upper</text>
<text x="46" y="716.8" font-size="15" fill="#334155">7 bits of the device address (Communication Interfaces, UART Interface,</text>
<text x="46" y="738.5" font-size="15" fill="#334155">Tables 1 and 2, p. 8). A chip never sends before it receives a command,</text>
<text x="46" y="760.2" font-size="15" fill="#334155">so one host and many chips share the pair (Communication Interfaces,</text>
<text x="46" y="782" font-size="15" fill="#334155">UART Interface, Tables 1 and 2, p. 8).</text>
</svg>
