<rect x="32" y="724.3" width="576" height="108.6" rx="10" fill="#F1F4F8" stroke="#CBD5E1" stroke-width="1"/>
<text x="200.4" y="229.7" font-size="14" font-weight="600" text-anchor="middle" fill="#334155">start</text>
<text x="345" y="197.5" font-size="14" font-weight="600" text-anchor="middle" fill="#334155">8 data bits, LSB first</text>
<text x="489.6" y="229.7" font-size="14" font-weight="600" text-anchor="middle" fill="#334155">stop</text>
<text x="32" y="278" font-size="15" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#0E1726">TX</text>
<text x="345" y="277.6" font-size="14" font-weight="600" text-anchor="middle" fill="#1E429F">D0 … D7</text>
<text x="32" y="326" font-size="15" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#0E1726">TXEN</text>
<text x="190.4" y="373.8" font-size="14" font-weight="700" fill="#0E1726">tPRE</text>
<text x="543.8" y="373.8" font-size="14" font-weight="700" fill="#0E1726">tPOST</text>
<text x="32" y="403.2" font-size="17" font-weight="700" fill="#0E1726">Timing values</text>
<text x="32" y="439.7" font-size="15" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#0E1726">baud</text>
<text x="608" y="439.7" font-size="15" font-weight="700" text-anchor="end" fill="#0E1726">min 9600 · max 250000 bit/s</text>
<text x="32" y="459.9" font-size="15" fill="#2B3442">Bit rate with automatic baud rate detection at the 40 MHz system clock</text>
<text x="32" y="480.1" font-size="14" fill="#566070">Datasheet UART, p. 24</text>
<text x="32" y="512.5" font-size="15" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#0E1726">baud</text>
<text x="608" y="512.5" font-size="15" font-weight="700" text-anchor="end" fill="#0E1726">max 5000000 bit/s</text>
<text x="32" y="532.8" font-size="15" fill="#2B3442">Highest fixed bit rate (x8 oversampling)</text>
<text x="32" y="552.9" font-size="14" fill="#566070">Datasheet Table 5. UART Baud Rates, p. 23</text>
<text x="32" y="585.4" font-size="15" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#0E1726">tPRE</text>
<text x="608" y="585.4" font-size="15" font-weight="700" text-anchor="end" fill="#0E1726">typ configurable</text>
<text x="32" y="605.6" font-size="15" fill="#2B3442">UART_TXEN high before the start bit: UART_TXEN_PRE_DELAY, default 0</text>
<text x="32" y="625.8" font-size="14" fill="#566070">Datasheet Bootloader, RS485 Configuration, p. 86</text>
<text x="32" y="658.2" font-size="15" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#0E1726">tPOST</text>
<text x="608" y="658.2" font-size="15" font-weight="700" text-anchor="end" fill="#0E1726">typ configurable</text>
<text x="32" y="678.5" font-size="15" fill="#2B3442">UART_TXEN high after the stop bit: UART_TXEN_POST_DELAY, default 0</text>
<text x="32" y="698.6" font-size="14" fill="#566070">Datasheet Bootloader, RS485 Configuration, p. 86</text>
<text x="46" y="752.8" font-size="17" font-weight="700" fill="#334155">Notes</text>
<text x="46" y="773.2" font-size="15" fill="#334155">The line idles high. A TMCL datagram is nine such characters; bit 0 of</text>
<text x="46" y="794.9" font-size="15" fill="#334155">the first is the sync bit, always 1, which the chip uses for automatic baud</text>
<text x="46" y="816.7" font-size="15" fill="#334155">rate detection.</text>
</svg>
