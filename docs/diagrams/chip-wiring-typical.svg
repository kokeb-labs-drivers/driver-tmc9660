<text x="50" y="917.7" font-size="20" font-weight="700" fill="#9F1239">Supplies and ground</text>
<text x="50" y="941.1" font-size="17" fill="#9F1239">VSA: VSA, WAKE · VS: VS · VCC_IO: VCC_IO; also U2.VIO · GNDP: GNDP · GND: AIN0, AIN1, AIN2, AIN3, EP, GND, GNDA; also</text>
<text x="50" y="965.8" font-size="17" fill="#9F1239">U2.GND</text>
<text x="50" y="1035.3" font-size="20" font-weight="700" fill="#334155">Also on the board</text>
<text x="50" y="1058.8" font-size="17" fill="#334155">Support parts: 11 capacitors, 1 resistor, 1 other part around the supplies (values in the full schematic). 35 pins are not drawn in</text>
<text x="50" y="1083.4" font-size="17" fill="#334155">this circuit; the full schematic lists them.</text>
<text x="32" y="1129.5" font-size="16" fill="#566070">* Not confirmed in the datasheet: R1: the pull-up value is a choice; the datasheet says FAULTN is open drain.</text>
