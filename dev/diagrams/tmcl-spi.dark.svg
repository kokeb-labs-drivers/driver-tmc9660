<text x="32" y="76.2" font-size="24" font-weight="700" fill="#E8EDF3">TMCL command and reply on SPI</text>
<text x="32" y="102.7" font-size="15" fill="#9AA6B5">Datasheet: Communication Interfaces, Serial-Peripheral Interface, p. 9.</text>
