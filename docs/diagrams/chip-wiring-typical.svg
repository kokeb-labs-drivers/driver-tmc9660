<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1197" viewBox="0 0 1200 1197" role="img" aria-labelledby="chip-wiring-typical-title chip-wiring-typical-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="chip-wiring-typical-title">Wiring: Typical application</title>
<desc id="chip-wiring-typical-desc">Wiring of the TMC9660 for the Typical application: MCU SPI SCK to GPIO11 (Transfer()); MCU SPI MOSI to GPIO10 (Transfer()); MCU SPI MISO to GPIO9 (Transfer()); MCU GPIO / CS to GPIO12 (Transfer()); MCU GPIO to RSTN (GpioSet(CtrlPin::Reset)); MCU GPIO to DRV_EN (GpioSet(CtrlPin::DrvEn)); MCU GPIO (IRQ) to FAULTN (GpioGet(CtrlPin::Faultn)). Supplies, grounds and the support parts are listed under the drawing.</desc>
<rect x="0.5" y="0.5" width="1199" height="1196" rx="16" fill="#FFFFFF" stroke="#E2E7EE"/>
<text x="32" y="46.8" font-size="16" font-weight="700" letter-spacing="1.2" fill="#7A360E">PINS AND WIRING</text>
<text x="32" y="85.6" font-size="32" font-weight="700" fill="#0E1726">Wiring: Typical application</text>
<text x="32" y="115.4" font-size="18" fill="#566070">What you connect by hand, with the driver hook on each MCU wire. The full schematic, with every part and value, is on the</text>
<text x="32" y="141.5" font-size="18" fill="#566070">Hardware page. Datasheet: Pin Descriptions, p. 12.</text>
