<rect x="0.5" y="0.5" width="639" height="828" rx="16" class="fk-f-canvas fk-s-frame"/>
<text x="32" y="44.4" font-size="13" font-weight="700" letter-spacing="1.2" class="fk-f-brand-text">SEVERAL CHIPS</text>
<text x="32" y="76.2" font-size="24" font-weight="700" class="fk-f-ink">TMC9660 nodes on RS-485</text>
<text x="32" y="102.7" font-size="15" class="fk-f-muted">Sources: ds UART, p. 25; pm Table 61, Full list of global parameters in bank</text>
<text x="32" y="124.5" font-size="15" class="fk-f-muted">0, p. 143; pm Communication Interfaces, UART Interface, Tables 1 and 2, p.</text>
<text x="32" y="146.2" font-size="15" class="fk-f-muted">8.</text>
<rect x="32" y="162.2" width="576" height="1" class="fk-f-hair"/>
<path d="M510.7 216.4 L510.7 594.4" fill="none" stroke-width="2.2" class="fk-s-ink2"/>
<path d="M452.3 224.4 L510.7 224.4" fill="none" stroke-width="1.8" class="fk-s-ink2"/>
<path d="M452.3 316.4 L510.7 316.4" fill="none" stroke-width="1.8" class="fk-s-ink2"/>
