# The vendor documents this driver was written against (handbook ADR-0019), and where the driver relies on them.
# Never commit a PDF: `sha256` identifies the exact file that was used, so a reader can confirm they hold the same
# revision. `pdf` is a stable direct link when the vendor publishes one; otherwise readers download from `url`.
# The reference manuals print a revision and a month ("Rev 0; 02/25") but no document number, so `number` is n/a and
# `date` is the month only. The application note prints neither a date nor a revision month; its
# `date` is the creation date of the PDF file (2025-01-08).
#
# The README card, docs/datasheet.md and the "Datasheet" box on each page are generated from this file by
# tools/docs/generators/datasheet.py (`kokeb-docs gen`). Section names and printed page numbers are the
# documents' own.
