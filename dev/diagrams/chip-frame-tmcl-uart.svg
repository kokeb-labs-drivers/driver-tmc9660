<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="442" viewBox="0 0 1200 442" role="img" aria-labelledby="chip-frame-tmcl-uart-title chip-frame-tmcl-uart-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="chip-frame-tmcl-uart-title">TMC9660: Parameter-mode UART datagram</title>
<desc id="chip-frame-tmcl-uart-desc">Parameter-mode UART datagram of the TMC9660, 72 bits, sent byte by byte, each byte least significant bit first, bit 0 first. Command: sync bit and module address (bits 0 to 7), operation (bits 8 to 15), type (bits 16 to 27), motor or bank (bits 28 to 31), data (big endian) (bits 32 to 63), checksum (bits 64 to 71); Reply: host address (bits 0 to 7), sync bit and module address (bits 8 to 15), TMCL status (bits 16 to 23), operation (bits 24 to 31), data (big endian) (bits 32 to 63), checksum (bits 64 to 71).</desc>
<rect x="0.5" y="0.5" width="1199" height="441" rx="16" fill="#FFFFFF" stroke="#E2E7EE"/>
<text x="32" y="46.8" font-size="16" font-weight="700" letter-spacing="1.2" fill="#7A360E">ON THE BUS</text>
<text x="32" y="85.6" font-size="32" font-weight="700" fill="#0E1726">TMC9660: Parameter-mode UART datagram</text>
<text x="32" y="115.4" font-size="18" fill="#566070">Every command and every reply is nine bytes, and the chip answers only after a command; the sync bit is always 1 and sets</text>
<text x="32" y="141.5" font-size="18" fill="#566070">the baud rate. 72 bits, sent from bit 0, each byte least significant bit first. Datasheet: Communication Interfaces, UART</text>
<text x="32" y="167.6" font-size="18" fill="#566070">Interface, Tables 1 and 2, p. 8.</text>
<rect x="32" y="183.6" width="1136" height="1" fill="#E2E7EE"/>
