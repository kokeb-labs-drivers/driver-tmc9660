<path d="M452.3 544.4 L510.7 544.4" fill="none" stroke-width="1.8" stroke-dasharray="5 4" class="fk-s-ink2"/>
<path d="M575.6 216.4 L575.6 594.4" fill="none" stroke-width="2.2" class="fk-s-ink2"/>
<path d="M452.3 234.4 L575.6 234.4" fill="none" stroke-width="1.8" class="fk-s-ink2"/>
<path d="M452.3 326.4 L575.6 326.4" fill="none" stroke-width="1.8" class="fk-s-ink2"/>
<path d="M452.3 440.4 L575.6 440.4" fill="none" stroke-width="1.8" class="fk-s-ink2"/>
<path d="M452.3 554.4 L575.6 554.4" fill="none" stroke-width="1.8" stroke-dasharray="5 4" class="fk-s-ink2"/>
<rect x="32" y="208.4" width="420.3" height="74" rx="10" stroke-width="1.4" class="fk-f-blue-tint fk-s-blue-strong"/>
<rect x="32" y="216.4" width="4" height="58" rx="2" class="fk-f-blue-strong"/>
<rect x="32" y="300.4" width="420.3" height="96" rx="10" stroke-width="1.4" class="fk-f-teal-tint fk-s-teal-strong"/>
<rect x="32" y="308.4" width="4" height="80" rx="2" class="fk-f-teal-strong"/>
<rect x="32" y="414.4" width="420.3" height="96" rx="10" stroke-width="1.4" class="fk-f-teal-tint fk-s-teal-strong"/>
<rect x="32" y="422.4" width="4" height="80" rx="2" class="fk-f-teal-strong"/>
<rect x="32" y="528.4" width="420.3" height="74" rx="10" stroke-width="1" stroke-dasharray="6 4" class="fk-f-card fk-s-line"/>
<rect x="32" y="624.4" width="576" height="173.8" rx="10" stroke-width="1" class="fk-f-slate-tint fk-s-slate-soft"/>
<text x="52" y="236.8" font-size="17" font-weight="700" class="fk-f-blue-text">Host</text>
<text x="52" y="264.6" font-size="15" class="fk-f-ink2">UART and RS-485 transceiver</text>
<text x="52" y="328.8" font-size="17" font-weight="700" class="fk-f-teal-text">TMC9660</text>
<text x="52" y="356.6" font-size="15" class="fk-f-ink2">address 1</text>
<text x="52" y="378.3" font-size="15" class="fk-f-ink2">UART_TXEN to the transceiver</text>
<text x="52" y="442.8" font-size="17" font-weight="700" class="fk-f-teal-text">TMC9660</text>
<text x="52" y="470.6" font-size="15" class="fk-f-ink2">address 3</text>
<text x="52" y="492.3" font-size="15" class="fk-f-ink2">UART_TXEN to the transceiver</text>
<text x="52" y="556.8" font-size="17" font-weight="700" class="fk-f-ink">…</text>
<text x="52" y="584.6" font-size="15" class="fk-f-ink2">up to address 255</text>
<text x="510.7" y="208.4" font-size="14" font-weight="700" text-anchor="middle" class="fk-f-ink">DATA+</text>
<circle cx="510.7" cy="224.4" r="3.6" class="fk-f-ink2"/>
<circle cx="510.7" cy="316.4" r="3.6" class="fk-f-ink2"/>
<circle cx="510.7" cy="430.4" r="3.6" class="fk-f-ink2"/>
<circle cx="510.7" cy="544.4" r="3.6" class="fk-f-ink2"/>
<text x="575.6" y="208.4" font-size="14" font-weight="700" text-anchor="middle" class="fk-f-ink">DATA-</text>
<circle cx="575.6" cy="234.4" r="3.6" class="fk-f-ink2"/>
<circle cx="575.6" cy="326.4" r="3.6" class="fk-f-ink2"/>
<circle cx="575.6" cy="440.4" r="3.6" class="fk-f-ink2"/>
<circle cx="575.6" cy="554.4" r="3.6" class="fk-f-ink2"/>
<text x="46" y="652.8" font-size="17" font-weight="700" class="fk-f-slate-text">Limits</text>
<text x="46" y="673.2" font-size="15" class="fk-f-slate-text">SERIAL_ADDRESS: odd values 1 to 255; the default is 1 (Table 61, Full list</text>
<text x="46" y="695" font-size="15" class="fk-f-slate-text">of global parameters in bank 0, p. 143). The module address is the upper</text>
<text x="46" y="716.8" font-size="15" class="fk-f-slate-text">7 bits of the device address (Communication Interfaces, UART Interface,</text>
<text x="46" y="738.5" font-size="15" class="fk-f-slate-text">Tables 1 and 2, p. 8). A chip never sends before it receives a command,</text>
<text x="46" y="760.2" font-size="15" class="fk-f-slate-text">so one host and many chips share the pair (Communication Interfaces,</text>
<text x="46" y="782" font-size="15" class="fk-f-slate-text">UART Interface, Tables 1 and 2, p. 8).</text>
</svg>
