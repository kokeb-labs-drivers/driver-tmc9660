<svg xmlns="http://www.w3.org/2000/svg" width="640" height="829" viewBox="0 0 640 829" role="img" aria-labelledby="uart-topology-title uart-topology-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" class="fk">
<title id="uart-topology-title">TMC9660 nodes on RS-485</title>
<desc id="uart-topology-desc">Several TMC9660 on one RS-485 bus: the host and every chip share the DATA+ and DATA- pair through transceivers, and each chip answers only commands sent to its own odd module address.</desc>
