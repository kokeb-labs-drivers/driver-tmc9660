<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="664" viewBox="0 0 1200 664" role="img" aria-labelledby="chip-frame-tmcl-spi-title chip-frame-tmcl-spi-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="chip-frame-tmcl-spi-title">TMC9660: Parameter-mode SPI datagram</title>
<desc id="chip-frame-tmcl-spi-desc">Parameter-mode SPI datagram of the TMC9660, 64 bits, most significant bit first. Command: operation (bits 63 to 56), type and motor or bank (bits 55 to 40), data (big endian) (bits 39 to 8), checksum (bits 7 to 0); Reply: SPI status (bits 63 to 56), TMCL status (bits 55 to 48), operation (bits 47 to 40), data (big endian) (bits 39 to 8), checksum (bits 7 to 0). Below, the SPI mode 3 waveform of one transfer in the same bit grid.</desc>
<rect x="0.5" y="0.5" width="1199" height="663" rx="16" fill="#0E131A" stroke="#283241"/>
<text x="32" y="46.8" font-size="16" font-weight="700" letter-spacing="1.2" fill="#F8D27A">ON THE BUS</text>
<text x="32" y="85.6" font-size="32" font-weight="700" fill="#E8EDF3">TMC9660: Parameter-mode SPI datagram</text>
<text x="32" y="115.4" font-size="18" fill="#9AA6B5">Every transfer is one 64-bit datagram in SPI mode 3; the reply answers the previous datagram. 64 bits, sent most significant</text>
<text x="32" y="141.5" font-size="18" fill="#9AA6B5">bit first. Datasheet: Communication Interfaces, Serial-Peripheral Interface, p. 9.</text>
<rect x="32" y="157.5" width="1136" height="1" fill="#252F3C"/>
