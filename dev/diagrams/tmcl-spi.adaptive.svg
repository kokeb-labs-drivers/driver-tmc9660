<text x="216.5" y="249.9" font-size="14" font-weight="600" text-anchor="middle" class="fk-f-blue-text">command</text>
<text x="473.5" y="249.9" font-size="14" font-weight="600" text-anchor="middle" class="fk-f-blue-text">next datagram</text>
<text x="32" y="298.3" font-size="15" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" class="fk-f-ink">MISO</text>
<text x="216.5" y="297.9" font-size="14" font-weight="600" text-anchor="middle" class="fk-f-teal-text">previous reply</text>
<text x="473.5" y="297.9" font-size="14" font-weight="600" text-anchor="middle" class="fk-f-teal-text">reply to command</text>
<text x="46" y="365.3" font-size="17" font-weight="700" class="fk-f-slate-text">Notes</text>
<text x="46" y="385.8" font-size="15" class="fk-f-slate-text">Command: operation, type and motor or bank, 4 data bytes, checksum.</text>
<text x="46" y="407.5" font-size="15" class="fk-f-slate-text">Reply: SPI status, TMCL status, operation, 4 data bytes, checksum. MSB</text>
<text x="46" y="429.2" font-size="15" class="fk-f-slate-text">first, data big-endian. SPI status 0xFF is OK, 0x00 a checksum error,</text>
<text x="46" y="451" font-size="15" class="fk-f-slate-text">0x0C the first reply after start-up and 0xF0 not ready: on 0xF0 send the</text>
<text x="46" y="472.7" font-size="15" class="fk-f-slate-text">datagram again.</text>
</svg>
