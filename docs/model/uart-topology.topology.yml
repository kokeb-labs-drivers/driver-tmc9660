id: uart-topology
title: TMC9660 nodes on RS-485
kicker: Several chips
alt: >-
  Several TMC9660 on one RS-485 bus: the host and every chip share the DATA+ and DATA- pair through transceivers, and
  each chip answers only commands sent to its own odd module address.
reads: >-
  The host, a UART with an RS-485 transceiver, shares the DATA+ and DATA- pair with TMC9660 at address 1, TMC9660 at
  address 3 and the chips left out. Each TMC9660 drives its transceiver with UART_TXEN while it replies and listens
  otherwise.
