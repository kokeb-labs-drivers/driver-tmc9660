# One row per thing the driver takes from a document: the documents' own section names and printed page
# numbers, the driver API that implements it, and the docs pages that explain it (file names in docs/).
topics:
  - topic: Package, pins and power-up pin functions
    doc: ds
    section: Pin Configurations; Pin Descriptions
    page: 11
    driver: "`CtrlPin`, `Config::mode`"
    docs: [hardware, quickstart]
  - topic: Application modes
    doc: ds
    section: Application Modes
    page: 16
    driver: "`Mode`, `GetMode()`, `Error::WrongMode`"
    docs: [architecture, parameter-mode, register-mode]
  - topic: Supply ranges and the hibernation mode
    doc: ds
    section: Power Supply - Electrical Characteristics
    page: 17
    driver: "`CtrlPin::Wake`, `PowerDown()`"
    docs: [hardware, safety]
  - topic: Pin functions at power-up and the UART and SPI of the bootloader
    doc: ds
    section: General-Purpose Input/Output Description
    page: 19
    driver: "`SpiPort`, `UartPort`, `Transfer()`, `Exchange()`"
    docs: [hardware, porting]
  - topic: UART bootloader frame and its CRC-8
    doc: ds
    section: Bootloader, UART Communication
    page: 70
    driver: "`detail::BlUartEncode()`, `Error::Crc`"
    docs: [bootloader]
  - topic: SPI bootloader frame and delayed reply
    doc: ds
    section: Bootloader, SPI Communication
    page: 72
    driver: "`detail::BlSpiEncode()`, `Config::spi_reply_retries`"
    docs: [bootloader]
  - topic: Bootloader commands and reply status codes
    doc: ds
    section: Bootloader, Commands
    page: 76
    driver: "`BlGetInfo()`, `BlRead32()`, `BlWrite32()`, `BlEraseFlashSector()`, `BlStartApplication()`"
    docs: [bootloader, api-guide]
  - topic: Boot configuration list, LDO and bootstrap configuration
    doc: ds
    section: Bootloader, Configuration
    page: 83
    driver: "`BootConfig`, `BootField`, `BlWriteConfig()`"
    docs: [bootloader, safety, configuration]
  - topic: Clock, reset, DRV_EN, WAKE and FAULTN
    doc: ds
    section: Clock and Control Description
    page: 63
    driver: "`CtrlPin`, `Config::hardware_reset`, `Service()`"
    docs: [hardware, safety, troubleshooting]
  - topic: Protections and the fault pin
    doc: ds
    section: Protections Description
    page: 56
    driver: "`GateDriverStart()`, `Error::DeviceFault`"
    docs: [safety, register-mode]
  - topic: Errata (OTP_BURN workaround, SPI slave MISO)
    doc: ds
    section: Errata
    page: 99
    driver: "`BlWrite32()` (OTP never written), `ReturnToBootloader()`"
    docs: [bootloader, safety]
  - topic: TMCL frames over UART and SPI
    doc: pm
    section: Communication Interfaces
    page: 8
    driver: "`SetParam()`, `GetParam()`, `detail::TmclSpiEncode()`"
    docs: [parameter-mode]
  - topic: Parameter table
    doc: pm
    section: Table 57, Full list of parameters
    page: 102
    driver: "`inc/tmc9660_params.hpp`, `FindParam()`"
    docs: [parameter-mode, datasheet]
  - topic: Register map
    doc: rm
    section: Register Map
    page: 57
    driver: "`inc/tmc9660_registers.hpp`, `FindRegister()`"
    docs: [register-mode, datasheet]
  - topic: Register-mode SPI and UART datagrams
