<text x="200.4" y="229.7" font-size="14" font-weight="600" text-anchor="middle" class="fk-f-slate-text">start</text>
<text x="345" y="197.5" font-size="14" font-weight="600" text-anchor="middle" class="fk-f-slate-text">8 data bits, LSB first</text>
<text x="489.6" y="229.7" font-size="14" font-weight="600" text-anchor="middle" class="fk-f-slate-text">stop</text>
<text x="32" y="278" font-size="15" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" class="fk-f-ink">TX</text>
<text x="345" y="277.6" font-size="14" font-weight="600" text-anchor="middle" class="fk-f-blue-text">D0 … D7</text>
<text x="32" y="326" font-size="15" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" class="fk-f-ink">TXEN</text>
<text x="190.4" y="373.8" font-size="14" font-weight="700" class="fk-f-ink">tPRE</text>
<text x="543.8" y="373.8" font-size="14" font-weight="700" class="fk-f-ink">tPOST</text>
<text x="32" y="403.2" font-size="17" font-weight="700" class="fk-f-ink">Timing values</text>
<text x="32" y="439.7" font-size="15" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" class="fk-f-ink">baud</text>
<text x="608" y="439.7" font-size="15" font-weight="700" text-anchor="end" class="fk-f-ink">min 9600 · max 250000 bit/s</text>
<text x="32" y="459.9" font-size="15" class="fk-f-ink2">Bit rate with automatic baud rate detection at the 40 MHz system clock</text>
<text x="32" y="480.1" font-size="14" class="fk-f-muted">Datasheet UART, p. 24</text>
<text x="32" y="512.5" font-size="15" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" class="fk-f-ink">baud</text>
<text x="608" y="512.5" font-size="15" font-weight="700" text-anchor="end" class="fk-f-ink">max 5000000 bit/s</text>
<text x="32" y="532.8" font-size="15" class="fk-f-ink2">Highest fixed bit rate (x8 oversampling)</text>
<text x="32" y="552.9" font-size="14" class="fk-f-muted">Datasheet Table 5. UART Baud Rates, p. 23</text>
<text x="32" y="585.4" font-size="15" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" class="fk-f-ink">tPRE</text>
<text x="608" y="585.4" font-size="15" font-weight="700" text-anchor="end" class="fk-f-ink">typ configurable</text>
<text x="32" y="605.6" font-size="15" class="fk-f-ink2">UART_TXEN high before the start bit: UART_TXEN_PRE_DELAY, default 0</text>
<text x="32" y="625.8" font-size="14" class="fk-f-muted">Datasheet Bootloader, RS485 Configuration, p. 86</text>
<text x="32" y="658.2" font-size="15" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" class="fk-f-ink">tPOST</text>
<text x="608" y="658.2" font-size="15" font-weight="700" text-anchor="end" class="fk-f-ink">typ configurable</text>
<text x="32" y="678.5" font-size="15" class="fk-f-ink2">UART_TXEN high after the stop bit: UART_TXEN_POST_DELAY, default 0</text>
<text x="32" y="698.6" font-size="14" class="fk-f-muted">Datasheet Bootloader, RS485 Configuration, p. 86</text>
<text x="46" y="752.8" font-size="17" font-weight="700" class="fk-f-slate-text">Notes</text>
<text x="46" y="773.2" font-size="15" class="fk-f-slate-text">The line idles high. A TMCL datagram is nine such characters; bit 0 of</text>
<text x="46" y="794.9" font-size="15" class="fk-f-slate-text">the first is the sync bit, always 1, which the chip uses for automatic baud</text>
<text x="46" y="816.7" font-size="15" class="fk-f-slate-text">rate detection.</text>
</svg>
