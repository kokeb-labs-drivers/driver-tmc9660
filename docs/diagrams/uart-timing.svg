<svg xmlns="http://www.w3.org/2000/svg" width="640" height="863" viewBox="0 0 640 863" role="img" aria-labelledby="uart-timing-title uart-timing-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="uart-timing-title">UART character and transceiver enable</title>
<desc id="uart-timing-desc">One UART character sent by the TMC9660: a start bit, eight data bits least significant first and a stop bit, with UART_TXEN raised before the start bit and dropped after the stop bit for an RS-485 transceiver.</desc>
<defs><marker id="uart-timing-arrow-ink2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2B3442"/></marker></defs>
<rect x="0.5" y="0.5" width="639" height="862" rx="16" fill="#FFFFFF" stroke="#E2E7EE"/>
<text x="32" y="44.4" font-size="13" font-weight="700" letter-spacing="1.2" fill="#7A360E">ON THE BUS</text>
<text x="32" y="76.2" font-size="24" font-weight="700" fill="#0E1726">UART character and transceiver enable</text>
<text x="32" y="102.7" font-size="15" fill="#566070">Sources: ds UART, p. 24; ds Table 5. UART Baud Rates, p. 23; ds</text>
<text x="32" y="124.5" font-size="15" fill="#566070">Bootloader, RS485 Configuration, p. 86; pm Communication Interfaces,</text>
<text x="32" y="146.2" font-size="15" fill="#566070">UART Interface, Tables 1 and 2, p. 8.</text>
