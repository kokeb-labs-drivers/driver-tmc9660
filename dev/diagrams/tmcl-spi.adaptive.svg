<svg xmlns="http://www.w3.org/2000/svg" width="640" height="519" viewBox="0 0 640 519" role="img" aria-labelledby="tmcl-spi-title tmcl-spi-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" class="fk">
<title id="tmcl-spi-title">TMCL command and reply on SPI</title>
<desc id="tmcl-spi-desc">A parameter-mode TMCL exchange on SPI: the reply to a 64-bit command comes back on MISO during the next 64-bit datagram, while the first datagram returns the reply to the one before it.</desc>
